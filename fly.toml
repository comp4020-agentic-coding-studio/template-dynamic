# Deploy config for the course-managed Fly.io setup. The resource defaults
# below are pinned — the course spend watchdog assumes them — so leave [[vm]],
# [mounts], and the auto-stop settings alone.
#
# There's deliberately no `app` line: the app name is pinned to this repo's
# name, and CI passes it with -a. (Deploying by hand — the escape hatch, CI
# deploys on every push to main once the repo is public — means
# `flyctl deploy --remote-only --ha=false -a <your-repo-name>`.)

primary_region = "syd"

[build]
dockerfile = "Dockerfile"

[env]
# the SQLite file lives on the volume, so state survives reloads, restarts,
# and redeploys
DATABASE_PATH = "/data/app.db"

[http_service]
internal_port = 4321
force_https = true
# the machine stops when nobody's using it and starts on the next request —
# this is most of why the app costs cents, not dollars
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

[mounts]
source = "data"
destination = "/data"
initial_size = "1gb"
